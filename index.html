  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Pascal AI Labs",
  "url": "https://pascalailabs.com",

  "founder": [

    { "@type": "PostalAddress", "streetAddress": "Indiqube Edge, ORR", "addressLocality": "Bangalore", "addressCountry": "India" }
  ]
}
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/Logo.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Nav.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Hero.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Partners.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/PortfolioBrowser.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Product.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Pillars.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Solutions.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Testimonials.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Security.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/FAQ.jsx?v=1778922181"></script>
  <script type="text/babel" src="components/Footer.jsx?v=1778922181"></script>

  <script type="text/babel">
    const App = () => {
      React.useEffect(() => {
        const tick = () => window.lucide && window.lucide.createIcons();
        tick();
        const id = setInterval(tick, 400);
        return () => clearInterval(id);
      }, []);
      return (
        <React.Fragment>
          <Nav/>
          <Hero/>
          <Partners/>
          <Product/>
          <Pillars/>
          <Solutions/>
          <Testimonials/>
          <Security/>
          <FAQ/>
          <Footer/>
        </React.Fragment>
      );
    };

    const waitForComponents = () => {
      const needed = ["Nav","Hero","Partners","Product","Pillars","Solutions","Testimonials","Security","FAQ","Footer"];
      if (needed.every(k => window[k])) {
        ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
      } else {
        setTimeout(waitForComponents, 30);
      }
    };
    waitForComponents();
  </script>
</body>
</html>
